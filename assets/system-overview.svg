<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Fire rescue robot planning loop</title>
  <desc id="desc">A closed loop from a dynamic grid world through local sensing, a belief map, hazard-aware planning, and robot motion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <text x="52" y="48" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Closed-loop planning under uncertainty</text>
  <text x="52" y="76" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15">Sense, update, re-plan, and move as the environment changes</text>

  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 250 172 H 310"/>
    <path d="M 520 172 H 580"/>
    <path d="M 790 172 H 850"/>
    <path d="M 1060 172 C 1125 172 1125 260 1090 260 H 168 C 110 260 110 213 110 204"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="40" y="108" width="210" height="96" rx="16" fill="#263244" stroke="#475569"/>
      <circle cx="76" cy="142" r="15" fill="url(#fire)"/>
      <path d="M70 149c-7-9 1-15 4-21 1 6 7 7 8 13 2-3 3-6 2-9 8 8 7 18 0 23-6 5-16 2-14-6z" fill="#fff" opacity=".9"/>
      <text x="104" y="143" fill="#f8fafc" font-size="17" font-weight="700">Dynamic world</text>
      <text x="68" y="176" fill="#cbd5e1" font-size="14">Hidden walls + spreading fire</text>
    </g>

    <g>
      <rect x="310" y="108" width="210" height="96" rx="16" fill="#263244" stroke="#475569"/>
      <circle cx="346" cy="142" r="15" fill="#38bdf8"/>
      <path d="M337 142h18M346 133v18M340 136l12 12M352 136l-12 12" stroke="#fff" stroke-width="2"/>
      <text x="374" y="143" fill="#f8fafc" font-size="17" font-weight="700">Local sensing</text>
      <text x="338" y="176" fill="#cbd5e1" font-size="14">Probabilistic radial observations</text>
    </g>

    <g>
      <rect x="580" y="108" width="210" height="96" rx="16" fill="#263244" stroke="#475569"/>
      <circle cx="616" cy="142" r="15" fill="#a78bfa"/>
      <path d="M607 133h18v18h-18zM613 133v18M619 133v18M607 139h18M607 145h18" stroke="#fff" stroke-width="1.5"/>
      <text x="644" y="143" fill="#f8fafc" font-size="17" font-weight="700">Belief map</text>
      <text x="608" y="176" fill="#cbd5e1" font-size="14">Log-odds occupancy + hazards</text>
    </g>

    <g>
      <rect x="850" y="108" width="210" height="96" rx="16" fill="#263244" stroke="#475569"/>
      <circle cx="886" cy="142" r="15" fill="#34d399"/>
      <path d="M878 148c5-11 10-13 17-13M878 148l5-1-3-4M895 135l-5 0 2 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="914" y="143" fill="#f8fafc" font-size="17" font-weight="700">Hazard-aware plan</text>
      <text x="878" y="176" fill="#cbd5e1" font-size="14">D* Lite, A*, or Temporal A*</text>
    </g>
  </g>

  <text x="600" y="278" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">Execute one motion step, observe new information, and repair the route</text>
</svg>
